<input
  type="search"
  class="w-full rounded-none border-b border-taupe bg-transparent px-1 py-3 font-ui text-lg outline-none placeholder:text-taupe focus:border-champagne"
  [attr.aria-label]="placeholder"
  [placeholder]="placeholder"
  (input)="term$.next($any($event.target).value)"
  (keydown.enter)="flush($any($event.target).value)"
/>
